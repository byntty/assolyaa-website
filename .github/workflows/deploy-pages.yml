name: Deploy to GitHub Pages

on:
  push:
    branches:
      - mainchange
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assolyaa-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assolyaa-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npm run build
          # GitHub Pages has no server-side SPA fallback, and the app uses
          # hash-based routing. Serve 404.html for any unknown path and
          # redirect old-style deep links (/gallery, /press, ...) to their
          # hash equivalents (/#/gallery) so refreshes and shared links work.
          cat > dist/404.html <<'REDIRECT'
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="utf-8" />
              <title>Assolyaa</title>
              <script>
                (function () {
                  var parts = location.pathname.split("/");
                  var last = parts.pop();
                  if (last !== "" && last !== "index.html" && last !== "404.html") {
                    location.replace(
                      location.pathname.replace(/[^/]*$/, "") + "#/" + last + location.search
                    );
                    return;
                  }
                  location.replace(location.pathname.replace(/[^/]*$/, ""));
                })();
              </script>
            </head>
            <body></body>
          </html>
          REDIRECT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: assolyaa-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
