name: Deploy to GitHub Pages

on:
  push:
    branches:
      - mainchange
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assolyaa-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assolyaa-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Convex types
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOYMENT" ]; then
            echo "::error::The CONVEX_DEPLOYMENT repository secret is not configured."
            exit 1
          fi
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::The CONVEX_DEPLOY_KEY repository secret is not configured."
            exit 1
          fi
          npx convex codegen

      - name: Build site
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error::The VITE_CONVEX_URL repository secret is not configured."
            exit 1
          fi
          if [ -z "$CONVEX_DEPLOYMENT" ]; then
            echo "::error::The CONVEX_DEPLOYMENT repository secret is not configured."
            exit 1
          fi
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: assolyaa-main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
